# One command brings the whole system up: docker compose up --wait
# Ports can be moved without editing this file, for example API_PORT=3010 docker compose up.

name: capacity-invoice-reservation

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capacity -d capacity -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Not our service. Locally it stands in for the treasury's broker (ADR-0001, ADR-0003).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list']
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://capacity:capacity@db:5432/capacity
      KAFKA_BROKERS: kafka:9092
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:80/']
      interval: 5s
      timeout: 5s
      retries: 20

  # Dev only: browse and edit rows by hand (ADR-0002). Never deployed to production.
  # Prisma Studio was the first choice and cannot be used here: it binds 127.0.0.1 inside its
  # container with no option to change that, so its port cannot be published.
  studio:
    image: sosedoff/pgweb:0.17.0
    command: ['--bind=0.0.0.0', '--listen=5555', '--url=postgres://capacity:capacity@db:5432/capacity?sslmode=disable']
    ports:
      - '${STUDIO_PORT:-5555}:5555'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5555']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
